name: Live chat checks

on:
  pull_request:
    paths:
      - "live-bootstrap.js"
      - "routes/live-chat.js"
      - "public/admin-live.js"
      - "public/live-chat-client.js"
      - "package.json"
      - "Procfile"
      - ".github/workflows/live-chat-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check live-bootstrap.js
      - run: node --check routes/live-chat.js
      - run: node --check public/admin-live.js
      - run: node --check public/live-chat-client.js
      - run: node -r ./live-bootstrap.js -e "const express=require('express'); const app=express(); if(!app){process.exit(1)}; console.log('bootstrap ok')"
